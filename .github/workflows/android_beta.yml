name: Build Android Beta APK
on:
  push:
    branches:
      - feat/survival-camp-exploration-v05
      - feat/visual-world-weather-v06
    paths:
      - .github/workflows/android_beta.yml
      - export_presets.cfg
      - project.godot
      - scripts/**
      - assets/**
      - shaders/**
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-beta:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # GitHub Ubuntu runners already provide a supported Android SDK manager.
      - name: Ensure Android SDK 35 tools
        run: |
          ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" "platform-tools" "build-tools;35.0.1" "platforms;android-35"
      - name: Install Godot 4.6.1 and export templates
        run: |
          curl --fail --location --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.6.1-stable/Godot_v4.6.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          echo '/tmp/godot' >> "$GITHUB_PATH"
          curl --fail --location --retry 3 -o /tmp/export.tpz https://github.com/godotengine/godot-builds/releases/download/4.6.1-stable/Godot_v4.6.1-stable_export_templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.6.1.stable"
          unzip -q /tmp/export.tpz -d /tmp/godot-templates
          cp /tmp/godot-templates/templates/* "$HOME/.local/share/godot/export_templates/4.6.1.stable/"
      - name: Configure isolated beta signature and SDK
        run: |
          mkdir -p "$HOME/.android" "$HOME/.config/godot" out
          keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=GPT Survivor Beta,OU=Testing,O=Dev,C=BR"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          EOF
          python3 - <<'PY'
          from pathlib import Path
          p=Path('export_presets.cfg')
          s=p.read_text()
          assert 'com.sergiomrge.gptsurvivor' in s
          s=s.replace('package/unique_name="com.sergiomrge.gptsurvivor"', 'package/unique_name="com.sergiomrge.gptsurvivor.beta.v06"')
          s=s.replace('version/name="0.6.0"', 'version/name="0.6.0-beta"')
          p.write_text(s)
          PY
      - name: Import and build Android ARM64 beta
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/.android/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH="$HOME/.android/debug.keystore"
          Godot_v4.6.1-stable_linux.x86_64 --headless --path . --editor --import --quit
          Godot_v4.6.1-stable_linux.x86_64 --headless --path . --export-debug Android /tmp/survivor-beta.apk
          python3 tools/android/fix_android_manifest.py /tmp/survivor-beta.apk /tmp/survivor-beta-fixed.apk
          "$ANDROID_SDK_ROOT/build-tools/35.0.1/zipalign" -f -P 16 4 /tmp/survivor-beta-fixed.apk /tmp/survivor-beta-aligned.apk
          "$ANDROID_SDK_ROOT/build-tools/35.0.1/apksigner" sign --ks "$HOME/.android/debug.keystore" --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android --out out/GPT_Survivor_v0_6_0_Beta.apk /tmp/survivor-beta-aligned.apk
          "$ANDROID_SDK_ROOT/build-tools/35.0.1/apksigner" verify --verbose out/GPT_Survivor_v0_6_0_Beta.apk
          "$ANDROID_SDK_ROOT/build-tools/35.0.1/zipalign" -c -P 16 4 out/GPT_Survivor_v0_6_0_Beta.apk
          "$ANDROID_SDK_ROOT/build-tools/35.0.1/aapt" dump badging out/GPT_Survivor_v0_6_0_Beta.apk | head -4
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('out/GPT_Survivor_v0_6_0_Beta.apk') as z:
              assert z.testzip() is None
          print('APK ZIP CRC: OK')
          PY
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: GPT-Survivor-v0.6-Android-Beta-APK
          path: out/GPT_Survivor_v0_6_0_Beta.apk
          retention-days: 14
