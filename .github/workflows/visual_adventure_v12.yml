name: Native Godot screenshots - deep caves and sea voyage
on:
  push:
    branches:
      - feat/deep-caves-atmosphere-voyage-v12
      - feat/cave-vents-voyage-hud-v13
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: real-game-v12-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-shots:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Godot 4.6.1 renderer
        run: |
          curl --fail --location --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.6.1-stable/Godot_v4.6.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          echo /tmp/godot >> "$GITHUB_PATH"
      - name: Import game project
        run: Godot_v4.6.1-stable_linux.x86_64 --headless --path . --editor --import --quit
      - name: Render authentic exploration and sailing gameplay
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          mkdir -p /tmp/survivor-adventure-v12
          xvfb-run -a -s "-screen 0 1280x720x24" timeout 240 Godot_v4.6.1-stable_linux.x86_64 --path . --script res://tests/capture_adventure_v12.gd
          test -s /tmp/survivor-adventure-v12/01_cave_east.png
          test -s /tmp/survivor-adventure-v12/02_cave_roots.png
          test -s /tmp/survivor-adventure-v12/03_navigation_controls.png
          test -s /tmp/survivor-adventure-v12/04_navigation_steering.png
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: GPT-Survivor-real-caves-and-voyage
          path: /tmp/survivor-adventure-v12/*.png
          retention-days: 7
