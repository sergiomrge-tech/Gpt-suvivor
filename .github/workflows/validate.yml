name: Validate Godot prototype
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Godot
        run: |
          curl --fail --location --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.6.1-stable/Godot_v4.6.1-stable_linux.x86_64.zip
          unzip /tmp/godot.zip -d /tmp/godot
          echo '/tmp/godot' >> "$GITHUB_PATH"
      - name: Import and parse
        run: |
          Godot_v4.6.1-stable_linux.x86_64 --headless --path . --editor --import --quit 2>&1 | tee /tmp/import.log
          if rg 'SCRIPT ERROR|ERROR:' /tmp/import.log; then exit 1; fi
      - name: Test complete survival progression
        run: Godot_v4.6.1-stable_linux.x86_64 --headless --path . --script res://tests/test_survivor.gd
      - name: Audit references and files
        run: python3 tests/audit_project.py
      - name: Validate original PCM audio
        run: python3 tests/audit_audio.py
      - name: Pack clean source
        run: git archive --format=zip --prefix=GPT_Survivor_Godot_v0_8_0/ HEAD -o /tmp/GPT_Survivor_Godot_v0_8_0.zip
      - uses: actions/upload-artifact@v4
        with:
          name: GPT-Survivor-Godot-source-v080
          path: /tmp/GPT_Survivor_Godot_v0_8_0.zip
