name: Validate Godot prototype
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: godot-source-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Godot
        run: |
          curl --fail --location --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.6.1-stable/Godot_v4.6.1-stable_linux.x86_64.zip
          unzip /tmp/godot.zip -d /tmp/godot
          echo '/tmp/godot' >> "$GITHUB_PATH"
      - name: Import and parse
        run: |
          Godot_v4.6.1-stable_linux.x86_64 --headless --path . --editor --import --quit 2>&1 | tee /tmp/import.log
          if grep -E 'SCRIPT ERROR|ERROR:' /tmp/import.log; then echo 'Import/parsing failed'; exit 1; fi
      - name: Bake normalized material batches and mobile distance LODs
        run: Godot_v4.6.1-stable_linux.x86_64 --headless --path . --script res://tools/bake_world_assets.gd
      - name: Validate complete map asset coverage and clearances
        run: Godot_v4.6.1-stable_linux.x86_64 --headless --path . --script res://tests/test_map_assets_v23.gd
      - name: Test rigged hero posture and looping locomotion
        run: Godot_v4.6.1-stable_linux.x86_64 --headless --path . --script res://tests/test_hero_locomotion.gd
      - name: Test complete survival progression
        run: Godot_v4.6.1-stable_linux.x86_64 --headless --path . --script res://tests/test_survivor.gd
      - name: Audit references and files
        run: python3 tests/audit_project.py
      - name: Validate original PCM audio
        run: python3 tests/audit_audio.py
      - name: Pack clean source
        run: git archive --format=zip --prefix=GPT_Survivor_Godot_v1_8_0/ HEAD -o /tmp/GPT_Survivor_Godot_v1_8_0.zip
      - uses: actions/upload-artifact@v4
        with:
          name: GPT-Survivor-Godot-source-v180
          path: /tmp/GPT_Survivor_Godot_v1_8_0.zip
