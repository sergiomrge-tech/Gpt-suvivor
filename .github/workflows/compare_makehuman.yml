name: Compare 3 downloaded MakeHuman models in Godot
on:
  push:
    branches: [feat/hero-asset-comparison]
    paths:
      - tests/capture_makehuman_options.gd
      - .github/workflows/compare_makehuman.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render-options:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download source-pinned MakeHuman assets
        run: |
          mkdir -p assets/characters/candidates
          cp assets/characters/makehuman_survivor.glb assets/characters/candidates/suited.glb
          curl --fail --location --retry 4 -o assets/characters/candidates/man.glb https://raw.githubusercontent.com/kunalkushwaha/vsim/main/packages/assets/library/man.glb
          curl --fail --location --retry 4 -o assets/characters/candidates/human.glb https://raw.githubusercontent.com/kunalkushwaha/vsim/main/packages/assets/library/human.glb
          python3 tests/verify_makehuman_asset.py assets/characters/candidates/suited.glb
          python3 tests/verify_makehuman_asset.py assets/characters/candidates/man.glb
          python3 tests/verify_makehuman_asset.py assets/characters/candidates/human.glb
          python3 - <<'PY'
          from pathlib import Path
          from hashlib import sha1
          originals={'suited.glb':'95033d30a4b4bab4a4a0ce3eb176a4ce7d73d0b5','man.glb':'bec48c7ad6be753520f7291510c1d63440df87b9','human.glb':'2569fa67af8c0acd786d79bcdac9cce6684e0085'}
          for name,expected in originals.items():
              data=Path('assets/characters/candidates',name).read_bytes()
              digest=sha1(b'blob '+str(len(data)).encode()+bytes([0])+data).hexdigest()
              assert digest==expected,(name,digest,expected)
              print('PINNED_MAKEHUMAN',name,len(data),digest)
          PY
      - name: Install Godot 4.6.1
        run: |
          curl --fail --location --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.6.1-stable/Godot_v4.6.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          echo /tmp/godot >> "$GITHUB_PATH"
      - name: Import actual files
        run: |
          Godot_v4.6.1-stable_linux.x86_64 --headless --path . --editor --import --quit > /tmp/import-mh.log 2>&1
          if grep -E 'SCRIPT ERROR|Parse Error' /tmp/import-mh.log; then cat /tmp/import-mh.log; exit 1; fi
      - name: Capture real 3d MakeHuman models and closeups
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          xvfb-run -a -s "-screen 0 1400x800x24" timeout 160 Godot_v4.6.1-stable_linux.x86_64 --path . --script res://tests/capture_makehuman_options.gd 2>&1 | tee /tmp/model-compare.log
          grep -q MAKEHUMAN_COMPARISON_COMPLETE /tmp/model-compare.log
          test -s /tmp/hero-options-real-godot/01_three_makehuman_models_original.png
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: GPT-Survivor-3-Real-MakeHuman-Options
          path: /tmp/hero-options-real-godot/*.png
          retention-days: 14
