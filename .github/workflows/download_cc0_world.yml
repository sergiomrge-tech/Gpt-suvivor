name: Acquire authentic CC0 world 3D assets
on:
  push:
    branches: [feat/cc0-aviation-palms-crafting-world]
    paths:
      - tests/world_assets/download_cc0.py
      - .github/workflows/download_cc0_world.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  source-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - name: Download verified authored GLB models and Poly Haven PBR
        run: python3 tests/world_assets/download_cc0.py
      - name: Verify actual models and dependencies
        run: |
          python3 - <<'PY'
          import json,pathlib,struct,hashlib
          root=pathlib.Path("assets/real_world")
          d=json.loads((root/"CATALOG.json").read_text())
          for item in d["items"]:
              assert item["license"]=="CC0"
              for asset in item["files"]:
                  f=root/asset["path"]
                  assert f.is_file() and f.stat().st_size==asset["size"]
                  assert hashlib.sha256(f.read_bytes()).hexdigest()==asset["sha256"]
              if item["kind"]=="glb":
                  b=(root/item["files"][0]["path"]).read_bytes()
                  assert b[:4]==b"glTF" and struct.unpack_from("<I",b,8)[0]==len(b)
              print("WORLD_MODEL_PASS",item["id"],item["kind"])
          PY
      - name: Commit untouched originals only to source branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/real_world
          git commit -m "assets(world): store verified CC0 palms, airplane, workbench, plants, terrain PBR originals"
          git push origin HEAD:feat/cc0-aviation-palms-crafting-world
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: GPT-Survivor-CC0-Palms-Airplane-Crafting-World-Source
          path: assets/real_world/
          retention-days: 21
